# public — what this workshop edition changed relative to its sources; linked from the card README.md
changes:
  - Took denballakh's readable sources as the merge base.
  - Fixed two runtime bugs — the ExecuteCodeFromString read-back target (`itemArray`) and the missing
    closing brace that nested `Display` under `SortKey` (block resolution).
  - Added English support and replaced the on-screen Cyrillic table words with colored Latin markers,
    so one Lang source serves both Rus and Eng.
  - Bundled the 14 FormStarMap panel textures, dropping the LEOGraphicsMod dependency.
  - Compiled the stub scenario `mod/Data/Script/mod_spacejunk.scr` from `src/Spacejunk.rson` (SRHD-XenoModKit `script build`).
  - Signed all four `.dat` (2026-09-19).
